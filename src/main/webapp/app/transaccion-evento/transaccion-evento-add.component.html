<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@transaccionEvento.add.headline">Añadir evento de movimiento</h1>
    <div>
        <a routerLink="/transaccionEventos" class="btn btn-secondary" i18n="@@transaccionEvento.add.back">Volver a la lista</a>
    </div>
</div>
<form [formGroup]="addForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="addForm" field="tvoEvento" i18n-label="@@transaccionEvento.tvoEvento.label" label="Evento" />
    <input type="submit" i18n-value="@@transaccionEvento.add.headline" value="Guardar" class="btn btn-primary mt-4" />
</form>
